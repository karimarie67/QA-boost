name: QA Test Suite - Boost.org

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - smoke
          - regression
          - all

env:
  TEST_ENV: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Smoke Tests (Quick Validation)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event.inputs.test_suite == 'smoke' || github.event.inputs.test_suite == 'all'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        
      - name: Run Smoke Tests
        run: npx playwright test tests/smoke_tests.spec.js --reporter=html --reporter=json
        continue-on-error: true
        
      - name: Rename results for dashboard
        if: always()
        run: |
          mkdir -p artifacts/smoke-test-results
          if [ -f "test-results.json" ]; then
            cp test-results.json artifacts/smoke-test-results/smoke-results.json
          fi
          if [ -d "playwright-report" ]; then
            cp -r playwright-report artifacts/smoke-test-results/
          fi
          if [ -d "test-results" ]; then
            cp -r test-results artifacts/smoke-test-results/
          fi
        
      - name: Upload Smoke Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: artifacts/smoke-test-results/
          retention-days: 30

  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Regression Tests (Full Validation)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event.inputs.test_suite == 'regression' || github.event.inputs.test_suite == 'all'
    needs: smoke-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run Boost.io Regression Tests
        run: npx playwright test tests/boost_io_tests.spec.js --reporter=html --reporter=json
        continue-on-error: true
        
      - name: Rename results for dashboard
        if: always()
        run: |
          mkdir -p artifacts/boost-io-test-results
          if [ -f "test-results.json" ]; then
            cp test-results.json artifacts/boost-io-test-results/boost-io-results.json
          fi
          if [ -d "playwright-report" ]; then
            cp -r playwright-report artifacts/boost-io-test-results/
          fi
          if [ -d "test-results" ]; then
            cp -r test-results artifacts/boost-io-test-results/
          fi
        
      - name: Upload Boost.io Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boost-io-test-results
          path: artifacts/boost-io-test-results/
          retention-days: 30

  version-regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Version Regression Tests
    if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event.inputs.test_suite == 'regression' || github.event.inputs.test_suite == 'all'
    needs: smoke-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Run Version Tests
        run: npx playwright test tests/boost_version_tests.spec.js --reporter=html --reporter=json
        continue-on-error: true
        
      - name: Rename results for dashboard
        if: always()
        run: |
          mkdir -p artifacts/version-test-results
          if [ -f "test-results.json" ]; then
            cp test-results.json artifacts/version-test-results/version-results.json
          fi
          if [ -d "playwright-report" ]; then
            cp -r playwright-report artifacts/version-test-results/
          fi
          if [ -d "test-results" ]; then
            cp -r test-results artifacts/version-test-results/
          fi
        
      - name: Upload Version Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-test-results
          path: artifacts/version-test-results/
          retention-days: 30

  update-dashboard:
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, version-regression-tests]
    if: always()
    name: Update QA Dashboard
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
        continue-on-error: true
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: List downloaded artifacts for debugging
        run: |
          echo "Artifacts structure:"
          ls -R ./artifacts || echo "No artifacts found"
          
      - name: Generate Dashboard
        run: |
          node dashboards/scripts/generate-dashboard.js
        env:
          TEST_ENV: ${{ env.TEST_ENV }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF: ${{ github.ref }}
          
      - name: Commit Dashboard Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboards/
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 Update QA Dashboard - Run #${{ github.run_number }} [${{ github.ref_name }}]" && git push)
